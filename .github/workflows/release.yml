name: Release

# When a GitHub release is published: builds the sdist and wheel and
# publishes them to PyPI, and pushes the Docker image to
# ghcr.io/theicelotus/erpdoo. The release's tag (v0.1.0 or 0.1.0) must
# match the version in pyproject.toml, or nothing is published.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build the sdist and wheel
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check the tag matches the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::the release tag $TAG does not match version $version in pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pip install build twine
      - run: python -m build
      # The README renders on PyPI, and the metadata is complete.
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Trusted publishing: PyPI accepts this workflow's OpenID Connect token,
  # for the pypi environment, instead of an API token (see
  # https://docs.pypi.org/trusted-publishers/).
  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/erpdoo/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: Push the Docker image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags the version and latest (not latest for a pre-release), with the
      # OCI labels that link the package to this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/theicelotus/erpdoo
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.build.outputs.version }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
