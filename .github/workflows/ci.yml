name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev,viewer]'
      - run: pytest -q

  smoke:
    name: Full stack smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Odoo 18 with demo data, Postgres 16, Redpanda and erpdoo. Returns once
      # Odoo's database is installed and the other services are started.
      - name: Start the stack
        run: docker compose up -d --build
      # dev: the scripts decode events with confluent-kafka's deserializers.
      - run: pip install -e '.[dev]'
      # Waits for Odoo and erpdoo, then drives every shipped event through Odoo,
      # and checks each event against its schema, in both formats, and Odoo.
      - name: Smoke test
        run: python scripts/smoke_test.py
      # Crashes erpdoo between delivery and confirmation, with a customer
      # rename in between, and checks the replayed event is unchanged.
      - name: Replay test
        run: python scripts/replay_test.py
      # Confirms orders while erpdoo is stopped, then while Redpanda is down;
      # each event must arrive exactly once, and the slot must not be
      # confirmed past an undelivered one (about a minute and a half).
      - name: Delivery test
        run: python scripts/delivery_test.py
      # Inbound messages: both shipped rules, a repeat, a missing record
      # (dead-lettered), Odoo stopped, and the loop marker (about a minute).
      - name: Inbound test
        run: python scripts/inbound_test.py
      # Installs a test module whose model sets its own _table.
      - name: Custom table name test
        run: python scripts/custom_table_test.py
      # Makes Postgres invalidate erpdoo's slot while erpdoo is stopped, and
      # checks that the missed window is backfilled (about a minute).
      - name: Backfill test
        run: python scripts/backfill_test.py
      # Installs a test app while two erpdoos run, replication and polling,
      # and changes its records before they may read them; each change must
      # arrive once, backfilled (about two minutes).
      - name: Late app test
        run: python scripts/late_app_test.py
      # Runs a second erpdoo in polling mode (Odoo's API only, no Postgres)
      # through the smoke test's scenarios, a restart, changes between two
      # polls, an inbound message and a delete, and compares its events with
      # replication mode's (about two minutes).
      - name: Polling test
        run: python scripts/polling_test.py
      - name: Show logs
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Stop the stack
        if: always()
        run: docker compose down -v
