# Inbound: a payment provider reports a payment for a customer invoice. See
# src/erpdoo/inbound.py for the rule format, and "Inbound" in the README.
#
#   {"id": "evt_3Q7x", "type": "PaymentReceived", "invoice": "INV/2026/00042",
#    "amount": 1725.0, "date": "2026-10-21", "payment_id": "pi_3Q7xY2"}

PaymentReceived:
  topic: payments.events
  model: account.move
  find:
    name: "{invoice}"
    move_type: out_invoice
    state: posted
  # This payment was registered before: its memo is the provider's id.
  already_done:
    model: account.payment
    find: { memo: "{payment_id}" }
  steps:
    # Odoo's Register Payment dialog, in the invoice's currency and default bank journal.
    - wizard: account.payment.register
      values: { amount: "{amount}", payment_date: "{date}", communication: "{payment_id}" }
      call: action_create_payments
  expect: { payment_state: [partial, in_payment, paid] }
