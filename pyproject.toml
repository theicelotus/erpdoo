[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erpdoo"
version = "0.0.1"
description = "Turn Odoo database changes into business events and stream them to Kafka and other sinks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9",
    "confluent-kafka>=2.6",
    "fastavro>=1.9",
    "PyYAML>=6",
]

[project.optional-dependencies]
viewer = ["fastapi>=0.110", "uvicorn>=0.29"]
# The test scripts decode events with confluent-kafka's own deserializers.
dev = ["pytest>=8", "httpx2>=2", "jsonschema>=4.18", "confluent-kafka[avro,json]>=2.6"]

[project.scripts]
erpdoo = "erpdoo.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
